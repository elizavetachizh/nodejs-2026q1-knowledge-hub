services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - DATABASE_HOST=${POSTGRES_HOST}
      - DATABASE_PORT=${POSTGRES_PORT}
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      vectordb:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/ || exit 1"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

# Database service  
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    networks:
      - app-net

  adminer:
    image: adminer
    profiles: [debug]
    ports:
      - "8080:8080"
    environment:
      # Pre-fills the 'Server' field in the login screen
      ADMINER_DEFAULT_SERVER: db 
    depends_on:
      - db
    networks:
      - app-net

  vectordb:
    image: qdrant/qdrant:v2.15.2
    ports:
      - "6333:6333"
    environment:
      QDRANT__AUTH__ENABLE: "false"
      QDRANT__STORAGE__PATH: "/data"
      QDRANT__STORAGE__VECTOR_CACHE_ENABLED: "true"
      QDRANT__STORAGE__VECTOR_CACHE_TTL: "3600"
      QDRANT__STORAGE__VECTOR_CACHE_SIZE: "1000000"
      QDRANT__STORAGE__VECTOR_CACHE_SHARD_COUNT: "1"
      QDRANT__STORAGE__VECTOR_CACHE_SHARD_SIZE: "1000000"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/ || exit 1"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net


volumes:
  pgdata:

networks:
  app-net:
    driver: bridge